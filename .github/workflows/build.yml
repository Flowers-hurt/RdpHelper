name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check translations (zh → en)
        run: python tools/check_i18n.py

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { ([xml](Get-Content src/RdpHelper/RdpHelper.csproj)).Project.PropertyGroup.Version | Select-Object -First 1 }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Publish (self-contained single file)
        run: >
          dotnet publish src/RdpHelper/RdpHelper.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Bundle official Win32-OpenSSH MSI (redist)
        shell: pwsh
        run: |
          $r = Invoke-RestMethod https://api.github.com/repos/PowerShell/Win32-OpenSSH/releases/latest -Headers @{ Authorization = "Bearer ${{ github.token }}" }
          $msi = $r.assets | Where-Object name -like 'OpenSSH-Win64-*.msi' | Select-Object -First 1
          $zip = $r.assets | Where-Object name -eq 'OpenSSH-Win64.zip' | Select-Object -First 1
          New-Item -ItemType Directory -Force publish\redist | Out-Null
          Invoke-WebRequest $msi.browser_download_url -OutFile "publish\redist\$($msi.name)"
          Invoke-WebRequest $zip.browser_download_url -OutFile openssh.zip
          Expand-Archive openssh.zip -DestinationPath openssh-zip
          $lic = Get-ChildItem openssh-zip -Recurse -Include 'LICENSE*', 'LICENCE*' | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName publish\redist\OpenSSH-LICENSE.txt }
          else { Invoke-WebRequest https://raw.githubusercontent.com/PowerShell/openssh-portable/latestw_all/LICENCE -OutFile publish\redist\OpenSSH-LICENSE.txt }
          "Win32-OpenSSH $($r.tag_name)" | Set-Content publish\redist\OpenSSH-VERSION.txt
          Copy-Item installer\restore-firewall.ps1 publish\
          # bore（MIT）随安装包内置：有人连 GitHub 都下载不了，bore 体积很小，直接打包进去
          $b = Invoke-RestMethod https://api.github.com/repos/ekzhang/bore/releases/latest -Headers @{ Authorization = "Bearer ${{ github.token }}" }
          $bz = $b.assets | Where-Object { $_.name -like '*x86_64-pc-windows*.zip' } | Select-Object -First 1
          Invoke-WebRequest $bz.browser_download_url -OutFile bore.zip
          Expand-Archive bore.zip -DestinationPath bore-x -Force
          Copy-Item (Get-ChildItem bore-x -Recurse -Filter bore.exe | Select-Object -First 1).FullName publish\redist\bore.exe
          Invoke-WebRequest https://raw.githubusercontent.com/ekzhang/bore/main/LICENSE -OutFile publish\redist\bore-LICENSE.txt
          "bore $($b.tag_name)" | Set-Content publish\redist\bore-VERSION.txt
          Get-ChildItem publish\redist | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Engine self-test (real RDP / SSH / firewall / tunnels)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish\RdpHelper.exe -ArgumentList '--selftest', "$PWD\selftest.json" -Wait -PassThru
          if (Test-Path selftest.json) {
            $r = Get-Content selftest.json -Raw -Encoding UTF8 | ConvertFrom-Json
            foreach ($s in $r.steps) { "{0} [{1,6} ms] {2}`n      {3}" -f ($(if ($s.Ok) { 'PASS' } else { 'FAIL' })), $s.Ms, $s.Name, $s.Detail }
            "passed=$($r.passed) failed=$($r.failed)"
          } else { "selftest.json not generated" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: GUI self-test + HiDPI screenshots
        if: always()
        shell: pwsh
        run: |
          $fail = 0
          $runs = @(
            @{ lang = 'zh'; dir = 'screenshots';      env = @{ RDPHELPER_GUI_INSTALLTEST = '1'; RDPHELPER_TEST_INSTALL_DELAY_MS = '6000' } },
            @{ lang = 'en'; dir = 'screenshots\en';   env = @{} },
            @{ lang = 'zh'; dir = 'screenshots\home'; env = @{ RDPHELPER_FAKE_HOME = '1'; RDPHELPER_GUI_PAGES = 'remote' } },
            @{ lang = 'en'; dir = 'screenshots\home-en'; env = @{ RDPHELPER_FAKE_HOME = '1'; RDPHELPER_GUI_PAGES = 'remote' } }
          )
          foreach ($run in $runs) {
            foreach ($k in $run.env.Keys) { Set-Item "env:$k" $run.env[$k] }
            $dir = "$PWD\$($run.dir)"
            $p = Start-Process -FilePath publish\RdpHelper.exe -ArgumentList '--gui-selftest', $dir, '--lang', $run.lang -Wait -PassThru
            "== $($run.dir) (exit $($p.ExitCode)) =="
            Get-Content "$dir\gui-selftest.txt" -Encoding UTF8 -ErrorAction SilentlyContinue
            if ($p.ExitCode -ne 0) { $fail = 1 }
            foreach ($k in $run.env.Keys) { Remove-Item "env:$k" }
          }
          Get-ChildItem screenshots -Recurse -Filter *.png | ForEach-Object { $_.FullName }
          exit $fail

      - name: Lifecycle self-test (close / reopen / tray / leftover process)
        if: always()
        shell: pwsh
        run: |
          $exe = "$PWD\publish\RdpHelper.exe"
          $script:fail = 0
          function Check($ok, $msg) { if ($ok) { "OK    $msg" } else { "FAIL  $msg"; $script:fail = 1 } }
          function Visible($p) { $p.Refresh(); -not $p.HasExited -and $p.MainWindowHandle -ne 0 }
          function WaitFor([scriptblock]$cond, [int]$sec) { $t = [DateTime]::Now.AddSeconds($sec); while ([DateTime]::Now -lt $t) { if (& $cond) { return $true }; Start-Sleep -Milliseconds 300 }; return [bool](& $cond) }
          function Launch() { Start-Process -FilePath $exe -PassThru }
          function Cleanup() { Get-Process RdpHelper -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep 1 }
          $cfg = "$env:ProgramData\RdpHelper\settings.json"
          function SetCfg($name, $value) {
            $j = if (Test-Path $cfg) { Get-Content $cfg -Raw | ConvertFrom-Json } else { [pscustomobject]@{} }
            $j | Add-Member -NotePropertyName $name -NotePropertyValue $value -Force
            New-Item -ItemType Directory -Force (Split-Path $cfg) | Out-Null
            $j | ConvertTo-Json -Depth 5 | Set-Content $cfg -Encoding UTF8
          }
          SetCfg CloseAction 'tray'

          "== A: second launch brings the running window back instead of an error =="
          $a = Launch
          Check (WaitFor { Visible $a } 40) "first instance shows its window"
          $b = Launch
          Check (WaitFor { $b.HasExited } 20) "second instance exits by itself (exit $($b.ExitCode))"
          Check (Visible $a) "first instance still running with a visible window"

          Cleanup

          "== C: default setting: close hides to tray, launching again restores it =="
          $d = Launch
          Check (WaitFor { Visible $d } 40) "window shown"
          [void]$d.CloseMainWindow()
          Check (WaitFor { -not (Visible $d) } 10) "window hidden after close"
          Start-Sleep 2
          Check (-not $d.HasExited) "process kept running in tray"
          $e = Launch
          Check (WaitFor { $e.HasExited } 20) "second launch exits"
          Check (WaitFor { Visible $d } 10) "hidden window is shown again"
          Cleanup

          "== B: setting = exit: closing the window really ends the process =="
          SetCfg CloseAction 'exit'
          $a = Launch
          Check (WaitFor { Visible $a } 40) "window shown"
          [void]$a.CloseMainWindow()
          Check (WaitFor { $a.HasExited } 15) "process exits after window close"
          $c = Launch
          Check (WaitFor { Visible $c } 40) "app opens again after being closed"
          [void]$c.CloseMainWindow()
          Check (WaitFor { $c.HasExited } 15) "and closes again"
          Cleanup

          "== D: leftover process without a window (old bug) is recovered on next launch =="
          $env:RDPHELPER_TEST_ZOMBIE = '1'
          $z = Launch
          Remove-Item env:RDPHELPER_TEST_ZOMBIE
          Start-Sleep 6
          Check (-not $z.HasExited -and -not (Visible $z)) "leftover process holds the lock with no window"
          $f = Launch
          Check (WaitFor { Visible $f } 45) "next launch opens a window anyway"
          Check (WaitFor { $z.HasExited } 10) "leftover process was ended"
          [void]$f.CloseMainWindow()
          Check (WaitFor { $f.HasExited } 15) "closes cleanly"
          Cleanup

          "== tray menu screenshots (real screen capture, shows DWM acrylic) =="
          Add-Type -AssemblyName System.Drawing, System.Windows.Forms
          New-Item -ItemType Directory -Force screenshots\tray | Out-Null
          foreach ($run in @('zh,light', 'zh,dark', 'en,light', 'en,dark')) {
            $lang, $theme = $run -split ','
            SetCfg Theme $theme
            $env:RDPHELPER_TEST_TRAYMENU = '1'
            $t = Start-Process -FilePath $exe -ArgumentList '--lang', $lang -PassThru
            Remove-Item env:RDPHELPER_TEST_TRAYMENU
            Start-Sleep 9
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\screenshots\tray\screen-$lang-$theme.png")
            $g.Dispose(); $bmp.Dispose()
            Check (-not $t.HasExited) "tray menu run ($lang $theme) still alive"
            Cleanup
          }
          SetCfg Theme 'system'
          SetCfg CloseAction 'tray'

          "== startup.log =="
          Get-Content "$env:LOCALAPPDATA\RdpHelper\startup.log" -ErrorAction SilentlyContinue
          exit $script:fail

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\RdpHelper.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path publish\RdpHelper.exe, publish\redist, publish\restore-firewall.ps1, LICENSE -DestinationPath "dist\RdpHelper-${{ steps.ver.outputs.version }}-portable-x64.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RdpHelper-${{ steps.ver.outputs.version }}
          path: |
            dist/*
            selftest.json
            screenshots/**

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
