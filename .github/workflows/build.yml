name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check translations (zh → en)
        run: python tools/check_i18n.py

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { ([xml](Get-Content src/RdpHelper/RdpHelper.csproj)).Project.PropertyGroup.Version | Select-Object -First 1 }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Publish (self-contained single file)
        run: >
          dotnet publish src/RdpHelper/RdpHelper.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Bundle official Win32-OpenSSH MSI (redist)
        shell: pwsh
        run: |
          $r = Invoke-RestMethod https://api.github.com/repos/PowerShell/Win32-OpenSSH/releases/latest -Headers @{ Authorization = "Bearer ${{ github.token }}" }
          $msi = $r.assets | Where-Object name -like 'OpenSSH-Win64-*.msi' | Select-Object -First 1
          $zip = $r.assets | Where-Object name -eq 'OpenSSH-Win64.zip' | Select-Object -First 1
          New-Item -ItemType Directory -Force publish\redist | Out-Null
          Invoke-WebRequest $msi.browser_download_url -OutFile "publish\redist\$($msi.name)"
          Invoke-WebRequest $zip.browser_download_url -OutFile openssh.zip
          Expand-Archive openssh.zip -DestinationPath openssh-zip
          $lic = Get-ChildItem openssh-zip -Recurse -Include 'LICENSE*', 'LICENCE*' | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName publish\redist\OpenSSH-LICENSE.txt }
          else { Invoke-WebRequest https://raw.githubusercontent.com/PowerShell/openssh-portable/latestw_all/LICENCE -OutFile publish\redist\OpenSSH-LICENSE.txt }
          "Win32-OpenSSH $($r.tag_name)" | Set-Content publish\redist\OpenSSH-VERSION.txt
          Get-ChildItem publish\redist | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Engine self-test (real RDP / SSH / firewall / tunnels)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish\RdpHelper.exe -ArgumentList '--selftest', "$PWD\selftest.json" -Wait -PassThru
          if (Test-Path selftest.json) {
            $r = Get-Content selftest.json -Raw -Encoding UTF8 | ConvertFrom-Json
            foreach ($s in $r.steps) { "{0} [{1,6} ms] {2}`n      {3}" -f ($(if ($s.Ok) { 'PASS' } else { 'FAIL' })), $s.Ms, $s.Name, $s.Detail }
            "passed=$($r.passed) failed=$($r.failed)"
          } else { "selftest.json not generated" }
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: GUI self-test + HiDPI screenshots
        if: always()
        shell: pwsh
        run: |
          $fail = 0
          $runs = @(
            @{ lang = 'zh'; dir = 'screenshots';      env = @{ RDPHELPER_GUI_INSTALLTEST = '1' } },
            @{ lang = 'en'; dir = 'screenshots\en';   env = @{} },
            @{ lang = 'zh'; dir = 'screenshots\home'; env = @{ RDPHELPER_FAKE_HOME = '1'; RDPHELPER_GUI_PAGES = 'remote' } },
            @{ lang = 'en'; dir = 'screenshots\home-en'; env = @{ RDPHELPER_FAKE_HOME = '1'; RDPHELPER_GUI_PAGES = 'remote' } }
          )
          foreach ($run in $runs) {
            foreach ($k in $run.env.Keys) { Set-Item "env:$k" $run.env[$k] }
            $dir = "$PWD\$($run.dir)"
            $p = Start-Process -FilePath publish\RdpHelper.exe -ArgumentList '--gui-selftest', $dir, '--lang', $run.lang -Wait -PassThru
            "== $($run.dir) (exit $($p.ExitCode)) =="
            Get-Content "$dir\gui-selftest.txt" -Encoding UTF8 -ErrorAction SilentlyContinue
            if ($p.ExitCode -ne 0) { $fail = 1 }
            foreach ($k in $run.env.Keys) { Remove-Item "env:$k" }
          }
          Get-ChildItem screenshots -Recurse -Filter *.png | ForEach-Object { $_.FullName }
          exit $fail

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\RdpHelper.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path publish\RdpHelper.exe, publish\redist, LICENSE -DestinationPath "dist\RdpHelper-${{ steps.ver.outputs.version }}-portable-x64.zip"
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RdpHelper-${{ steps.ver.outputs.version }}
          path: |
            dist/*
            selftest.json
            screenshots/**

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
