<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RdpHelper 远程桌面助手</title>
<meta name="description" content="一键开启 Windows 远程桌面与 OpenSSH，自定义端口、IP 黑白名单、按需内网穿透。Win11 设置风格，开源免费。" />
<meta property="og:title" content="RdpHelper 远程桌面助手" />
<meta property="og:description" content="一键开启 Windows 远程桌面 / OpenSSH · 自定义端口 · IP 黑白名单 · 按需内网穿透" />
<meta property="og:image" content="https://flowers-hurt.github.io/RdpHelper/shots/zh/remote-dark.jpg" />
<meta name="theme-color" content="#0067c0" />
<link rel="icon" type="image/png" href="assets/logo.png" />
<style>
:root {
  --bg: #f3f3f3;
  --bg-2: #ebebeb;
  --card: rgba(255, 255, 255, .72);
  --card-solid: #fbfbfb;
  --card-hover: rgba(255, 255, 255, .92);
  --stroke: rgba(0, 0, 0, .07);
  --stroke-2: rgba(0, 0, 0, .12);
  --text: #1a1a1a;
  --text-2: #5d5d5d;
  --text-3: #8a8a8a;
  --accent: #0067c0;
  --accent-2: #005fb8;
  --accent-text: #ffffff;
  --accent-soft: rgba(0, 103, 192, .09);
  --ok: #0f7b0f;
  --shadow: 0 2px 4px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.08);
  --shadow-lg: 0 8px 16px rgba(0,0,0,.08), 0 32px 80px rgba(0,0,0,.16);
  --bloom-1: #7cc4ff;
  --bloom-2: #b9a6ff;
  --bloom-3: #8fe3d6;
  --code: rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1c1c; --bg-2: #202020; --card: rgba(43, 43, 43, .68); --card-solid: #2b2b2b; --card-hover: rgba(50, 50, 50, .9);
    --stroke: rgba(255,255,255,.07); --stroke-2: rgba(255,255,255,.12);
    --text: #ffffff; --text-2: #c5c5c5; --text-3: #9a9a9a;
    --accent: #4cc2ff; --accent-2: #47b1e8; --accent-text: #000000; --accent-soft: rgba(76,194,255,.12); --ok: #6ccb5f;
    --shadow: 0 2px 4px rgba(0,0,0,.2), 0 12px 32px rgba(0,0,0,.3); --shadow-lg: 0 8px 16px rgba(0,0,0,.3), 0 32px 80px rgba(0,0,0,.5);
    --bloom-1: #0a4b8c; --bloom-2: #3c2a7a; --bloom-3: #0b5a52; --code: rgba(255,255,255,.07);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1c1c; --bg-2: #202020; --card: rgba(43, 43, 43, .68); --card-solid: #2b2b2b; --card-hover: rgba(50, 50, 50, .9);
  --stroke: rgba(255,255,255,.07); --stroke-2: rgba(255,255,255,.12);
  --text: #ffffff; --text-2: #c5c5c5; --text-3: #9a9a9a;
  --accent: #4cc2ff; --accent-2: #47b1e8; --accent-text: #000000; --accent-soft: rgba(76,194,255,.12); --ok: #6ccb5f;
  --shadow: 0 2px 4px rgba(0,0,0,.2), 0 12px 32px rgba(0,0,0,.3); --shadow-lg: 0 8px 16px rgba(0,0,0,.3), 0 32px 80px rgba(0,0,0,.5);
  --bloom-1: #0a4b8c; --bloom-2: #3c2a7a; --bloom-3: #0b5a52; --code: rgba(255,255,255,.07);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
img { max-width: 100%; height: auto; display: block; }
code { font-family: "Cascadia Code", "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: .9em; background: var(--code); padding: 1px 6px; border-radius: 4px; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; }

/* Win11 Bloom 风格的柔光背景 */
.bloom { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bloom i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
.bloom i:nth-child(1) { width: 720px; height: 720px; background: var(--bloom-1); top: -260px; right: -160px; }
.bloom i:nth-child(2) { width: 560px; height: 560px; background: var(--bloom-2); top: 120px; left: -260px; opacity: .4; }
.bloom i:nth-child(3) { width: 520px; height: 520px; background: var(--bloom-3); top: 900px; right: -200px; opacity: .3; }

/* 顶栏：亚克力 */
header.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  backdrop-filter: saturate(160%) blur(24px); -webkit-backdrop-filter: saturate(160%) blur(24px);
  border-bottom: 1px solid var(--stroke);
}
header.top .wrap { display: flex; align-items: center; gap: 20px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--text); font-size: 16px; }
.brand:hover { text-decoration: none; }
.brand img { width: 28px; height: 28px; }
nav.links { display: flex; gap: 4px; margin-left: 12px; }
nav.links a { color: var(--text-2); padding: 6px 12px; border-radius: 6px; font-size: 14px; }
nav.links a:hover { background: var(--accent-soft); color: var(--text); text-decoration: none; }
.top-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.icon-btn {
  height: 34px; min-width: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--stroke);
  background: var(--card); color: var(--text); cursor: pointer; font: inherit; font-size: 13px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.icon-btn:hover { background: var(--card-hover); text-decoration: none; }
.icon-btn svg { width: 16px; height: 16px; }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 20px; border-radius: 8px;
  font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; border: 1px solid transparent; white-space: nowrap;
}
.btn:hover { text-decoration: none; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-primary { background: var(--accent); color: var(--accent-text); border-color: rgba(0,0,0,.08); box-shadow: inset 0 -1px 0 rgba(0,0,0,.18); }
.btn-primary:hover { background: var(--accent-2); }
.btn-secondary { background: var(--card); color: var(--text); border-color: var(--stroke-2); backdrop-filter: blur(20px); }
.btn-secondary:hover { background: var(--card-hover); }

/* Hero */
.hero { padding: 72px 0 40px; }
.hero .wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: center; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 6px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--stroke); font-size: 13px; color: var(--text-2); backdrop-filter: blur(20px);
}
.pill b { background: var(--accent); color: var(--accent-text); border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
h1 { font-size: clamp(34px, 4.2vw, 54px); line-height: 1.12; margin: 20px 0 16px; font-weight: 700; letter-spacing: -.02em; }
h1 .grad { white-space: nowrap; background: linear-gradient(100deg, var(--accent), #8a63ff 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { font-size: 18px; color: var(--text-2); margin: 0 0 28px; max-width: 34em; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; }
.meta { margin-top: 18px; color: var(--text-3); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 18px; }
.meta span { display: inline-flex; align-items: center; gap: 6px; }
.meta svg { width: 14px; height: 14px; }

.showcase { position: relative; }
.window {
  border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-lg); border: 1px solid var(--stroke-2);
  background: var(--card-solid); transform: perspective(1600px) rotateY(-6deg) rotateX(2deg); transform-origin: left center;
  transition: transform .6s cubic-bezier(.2,.8,.2,1);
}
.showcase:hover .window { transform: perspective(1600px) rotateY(0) rotateX(0); }
.window img { width: 100%; aspect-ratio: 1600 / 1246; }
.tray {
  position: absolute; right: -18px; bottom: -36px; width: 46%; max-width: 300px; border-radius: 8px; overflow: hidden;
  box-shadow: var(--shadow-lg); border: 1px solid var(--stroke-2);
}
.tray img { width: 100%; }

/* 区块 */
section { padding: 72px 0; }
.sec-head { text-align: center; max-width: 720px; margin: 0 auto 40px; }
.eyebrow { color: var(--accent); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
h2 { font-size: clamp(28px, 3.4vw, 38px); line-height: 1.2; margin: 8px 0 12px; letter-spacing: -.01em; }
.sec-head p { color: var(--text-2); margin: 0; font-size: 16px; }

.card {
  background: var(--card); border: 1px solid var(--stroke); border-radius: 8px; box-shadow: var(--shadow);
  backdrop-filter: blur(30px) saturate(140%); -webkit-backdrop-filter: blur(30px) saturate(140%);
}

/* 三步 */
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; counter-reset: s; }
.step { padding: 24px; position: relative; }
.step::before {
  counter-increment: s; content: counter(s); display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent); color: var(--accent-text); font-weight: 700; margin-bottom: 14px;
}
.step h3 { margin: 0 0 6px; font-size: 17px; }
.step p { margin: 0; color: var(--text-2); font-size: 14px; }

/* 功能 */
.features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.feature { padding: 22px 22px 20px; transition: background .2s, transform .2s; }
.feature:hover { background: var(--card-hover); transform: translateY(-2px); }
.feature .ico {
  width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; margin-bottom: 14px;
  background: var(--accent-soft); color: var(--accent);
}
.feature .ico svg { width: 22px; height: 22px; }
.feature h3 { margin: 0 0 6px; font-size: 17px; }
.feature p { margin: 0 0 10px; color: var(--text-2); font-size: 14px; }
.feature ul { margin: 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--text-2); }
.feature li { padding-left: 20px; position: relative; margin: 4px 0; }
.feature li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 10px; height: 6px; border-left: 2px solid var(--ok); border-bottom: 2px solid var(--ok); transform: rotate(-45deg) translateY(-3px); }

/* 截图画廊 */
.tabs { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
.tab {
  border: 1px solid transparent; background: transparent; color: var(--text-2); font: inherit; font-size: 14px;
  padding: 7px 14px; border-radius: 6px; cursor: pointer;
}
.tab:hover { background: var(--accent-soft); color: var(--text); }
.tab[aria-selected="true"] { background: var(--card); border-color: var(--stroke); color: var(--text); font-weight: 600; box-shadow: var(--shadow); position: relative; }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 16px; height: 3px; border-radius: 2px; background: var(--accent); transform: translateX(-50%); }
.gallery { max-width: 980px; margin: 0 auto; }
.gallery .window { transform: none; }
.gallery .window img { transition: opacity .25s; }
.gallery figcaption { text-align: center; color: var(--text-3); font-size: 13px; margin-top: 14px; }

/* 穿透对比表 */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 14px 18px; border-bottom: 1px solid var(--stroke); vertical-align: top; }
th { color: var(--text-2); font-weight: 600; font-size: 13px; }
tr:last-child td { border-bottom: 0; }
td b { font-size: 15px; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 4px; background: var(--accent); color: var(--accent-text); margin-left: 6px; font-weight: 600; vertical-align: 1px; }
.tag.gray { background: var(--code); color: var(--text-2); }

/* 信任 */
.trust { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.trust .card { padding: 22px; }
.trust .num { font-size: 32px; font-weight: 700; color: var(--accent); line-height: 1.1; }
.trust h3 { margin: 8px 0 4px; font-size: 15px; }
.trust p { margin: 0; color: var(--text-2); font-size: 13.5px; }

/* 下载 */
.download { padding: 36px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: center; }
.download h2 { margin-top: 0; }
.download p { color: var(--text-2); margin: 0 0 20px; }
.dl-list { display: grid; gap: 10px; }
.dl-item {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--stroke-2);
  background: var(--card-solid); color: var(--text);
}
.dl-item:hover { text-decoration: none; border-color: var(--accent); }
.dl-item .ico { width: 36px; height: 36px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.dl-item .ico svg { width: 20px; height: 20px; }
.dl-item b { display: block; font-size: 15px; }
.dl-item small { color: var(--text-3); font-size: 12.5px; }
.dl-item .arrow { margin-left: auto; color: var(--text-3); }
.req { font-size: 13px; color: var(--text-3); margin-top: 14px; }

/* FAQ */
.faq { max-width: 820px; margin: 0 auto; display: grid; gap: 8px; }
.faq details { padding: 0; }
.faq summary {
  list-style: none; cursor: pointer; padding: 16px 20px; font-weight: 600; display: flex; align-items: center; gap: 12px;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--text-3); border-bottom: 2px solid var(--text-3); transform: rotate(45deg); transition: transform .2s; flex: none; }
.faq details[open] summary::after { transform: rotate(-135deg); }
.faq .ans { padding: 0 20px 18px; color: var(--text-2); font-size: 14.5px; }
.faq .ans p { margin: 0 0 8px; }

footer { border-top: 1px solid var(--stroke); padding: 32px 0 48px; color: var(--text-3); font-size: 13px; margin-top: 40px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
footer .links { margin-left: auto; display: flex; gap: 18px; }
footer a { color: var(--text-2); }

.reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
.reveal.in { opacity: 1; transform: none; }

@media (max-width: 980px) {
  .hero .wrap { grid-template-columns: 1fr; }
  .window { transform: none; }
  .features { grid-template-columns: repeat(2, 1fr); }
  .trust { grid-template-columns: repeat(2, 1fr); }
  .download { grid-template-columns: 1fr; }
  nav.links { display: none; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .hero { padding-top: 40px; }
  .steps, .features, .trust { grid-template-columns: 1fr; }
  .tray { right: -6px; bottom: -28px; width: 52%; }
  .download { padding: 22px; }
  section { padding: 56px 0; }
  .icon-btn .lbl { display: none; }
  footer .links { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
  .reveal { opacity: 1; transform: none; }
}
</style>
</head>

    tunnels: [
      ["bore", "Recommended", "None", "Bundled", "mstsc to <code>bore.pub:port</code>"],
      ["Cloudflare Tunnel", "", "None", "Bundled", "The other side uses RdpHelper's “Visit another PC”"],
      ["ngrok", "", "Account Authtoken", "~30 MB", "mstsc to <code>x.tcp.ngrok.io:port</code>"]
    ],
    trust: [
      ["33", "real-machine self-tests", "Every build really toggles Remote Desktop, changes ports, installs SSH and opens tunnels on Windows in GitHub Actions."],
      ["2", "bundled tunnel clients", "bore (MIT) and cloudflared (Apache-2.0) are bundled with their licenses; ngrok is fetched from its official source only when needed."],
      ["MIT", "license", "All source code is public. Use, modify and share it freely."],
      ["0", "hacks or bypasses", "No patched system files, no activation tricks. Home edition only gets Microsoft's official upgrade paths."]
    ],
    faq: [
      ["Do Remote Desktop and SSH still work after I exit RdpHelper?", "<p>Yes. They are Windows system services; RdpHelper just changes their settings, so they keep working and start at boot. Only tunnels need the app running, which is why closing the window minimizes to the tray by default.</p>"],
      ["It keeps saying my password is wrong, or my PC has no password", "<p>Windows does not allow remote logins to accounts with a blank password. Set one on the Accounts page, or create a remote-only account. If you sign in with a Microsoft account, use its password, not your PIN.</p>"],
      ["Does it work on Windows Home?", "<p>Windows Home cannot host Remote Desktop; that is an OS limitation. You can use SSH instead, or upgrade to Pro from the app through the Microsoft Store or your own product key.</p>"],
      ["Can two people use different accounts on the same PC at once?", "<p>Windows Home / Pro allow one desktop user at a time; a second account signing in disconnects the current user (their apps keep running). For simultaneous desktops use Windows Server Remote Desktop Services. For command-line work, SSH supports many concurrent sessions. RdpHelper never patches system files to bypass this.</p>"],
      ["Does it send my password anywhere?", "<p>No. Copied connection info contains the computer name, user name, address and instructions, never the password. All source code is public, so you can check every network address the app talks to.</p>"],
      ["What is left after uninstalling?", "<p>The uninstaller removes RdpHelper's firewall rules and re-enables the built-in Remote Desktop rules so you are not locked out. Your Remote Desktop / SSH settings are kept.</p>"]
    ]
  }
};

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
let lang = store.get("lang") || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
let theme = store.get("theme") || "auto";
let page = "remote";
let release = null;
let stars = null;

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const dark = () => theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);

function shot(p) { return `shots/${lang}/${p}-${dark() ? "dark" : "light"}.jpg`; }

function renderShots() {
  $("#heroShot").src = shot("remote");
  const tray = $("#trayShot"), tm = dark() ? "dark" : "light";
  tray.onerror = () => { tray.onerror = null; tray.src = `assets/tray-en-${tm}.png`; };
  tray.src = `assets/tray-${lang}-${tm}.png`;
  const g = $("#galleryShot");
  g.style.opacity = .35;
  const img = new Image();
  img.onload = () => { g.src = img.src; g.style.opacity = 1; };
  img.onerror = () => { g.style.opacity = 1; };
  img.src = shot(page);
  g.alt = (T[lang].tabs.find(t => t[0] === page) || [])[1] || "";
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = lang === "zh" ? "RdpHelper 远程桌面助手" : "RdpHelper · One-click Windows Remote Desktop";
  document.querySelectorAll("[data-i18n]").forEach(el => { if (t[el.dataset.i18n] != null) el.innerHTML = t[el.dataset.i18n]; });
  $("#langLbl").textContent = lang === "zh" ? "English" : "中文";

  $("#featureGrid").innerHTML = t.features.map(f => `
    <div class="card feature reveal in">
      <div class="ico"><svg><use href="#i-${f.ico}"/></svg></div>
      <h3>${f.t}</h3><p>${f.d}</p>
      <ul>${f.li.map(x => `<li>${x}</li>`).join("")}</ul>
    </div>`).join("");

  $("#tabs").innerHTML = t.tabs.map(([k, n]) =>
    `<button class="tab" role="tab" type="button" data-k="${k}" aria-selected="${k === page}">${n}</button>`).join("");

  $("#tunnelRows").innerHTML = t.tunnels.map(r => `
    <tr><td><b>${r[0]}</b>${r[1] ? `<span class="tag">${r[1]}</span>` : ""}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join("");

  $("#trustGrid").innerHTML = t.trust.map(r => `
    <div class="card reveal in"><div class="num">${r[0]}</div><h3>${r[1]}</h3><p>${r[2]}</p></div>`).join("");

  $("#faqList").innerHTML = t.faq.map((q, i) => `
    <details class="card reveal in"${i === 0 ? " open" : ""}><summary>${q[0]}</summary><div class="ans">${q[1]}</div></details>`).join("");

  renderRelease();
  if (stars != null) $("#starCount").textContent = fmt(t.star, { n: stars });
  renderShots();
  renderTheme();
}

function renderTheme() {
  document.documentElement.dataset.theme = theme;
  $("#themeIco").setAttribute("href", theme === "auto" ? "#i-auto" : theme === "dark" ? "#i-moon" : "#i-sun");
  const label = T[lang]["theme." + theme];
  $("#themeBtn").title = label; $("#themeBtn").setAttribute("aria-label", label);
}

function renderRelease() {
  if (!release) return;
  const t = T[lang];
  const v = release.tag_name;
  $("#verPill").textContent = v;
  const find = re => (release.assets || []).find(a => re.test(a.name));
  const setup = find(/Setup.*\.exe$/i), zip = find(/portable.*\.zip$/i);
  const meta = a => fmt(t["dl.meta"], { v, size: (a.size / 1048576).toFixed(0), n: a.download_count.toLocaleString() });
  if (setup) { $("#dlSetup").href = setup.browser_download_url; $("#dlSetupMeta").textContent = meta(setup); $("#ctaDownload").href = setup.browser_download_url; }
  if (zip) { $("#dlZip").href = zip.browser_download_url; $("#dlZipMeta").textContent = meta(zip); }
}

$("#langBtn").onclick = () => { lang = lang === "zh" ? "en" : "zh"; store.set("lang", lang); render(); };
$("#themeBtn").onclick = () => { theme = { auto: "light", light: "dark", dark: "auto" }[theme]; store.set("theme", theme); renderTheme(); renderShots(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (theme === "auto") renderShots(); });
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  page = b.dataset.k;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b));
  renderShots();
});
$("#year").textContent = new Date().getFullYear();

// 滚动进入时淡入
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
}), { rootMargin: "0px 0px -60px 0px" }) : null;
document.querySelectorAll(".reveal").forEach(el => io ? io.observe(el) : el.classList.add("in"));

render();

// 最新版本与下载链接（GitHub 公开 API；失败时保留指向 Releases 页的链接）
fetch(`https://api.github.com/repos/${REPO}/releases/latest`).then(r => r.ok ? r.json() : null).then(j => { if (j) { release = j; renderRelease(); } }).catch(() => {});
fetch(`https://api.github.com/repos/${REPO}`).then(r => r.ok ? r.json() : null).then(j => {
  if (j && typeof j.stargazers_count === "number") { stars = j.stargazers_count; $("#starCount").textContent = fmt(T[lang].star, { n: stars }); }
}).catch(() => {});
</script>
</body>
</html>
